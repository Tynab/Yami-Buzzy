server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml font/otf;

    # Never serve dotfiles (.git, .gitattributes, ...)
    location ~ /\. {
        return 404;
    }

    # Fonts: nginx has no mime type for .otf
    location ~* \.otf$ {
        default_type font/otf;
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # Images and fonts rarely change
    location ~* \.(?:png|jpe?g|webp|avif|gif|svg|ico|woff2?|ttf)$ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options "nosniff";
    }

    # HTML/CSS/JS file names are not content-hashed: always revalidate (ETag)
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        try_files $uri $uri/ =404;
    }
}
